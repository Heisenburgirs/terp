[package]
name = "terp"
version = "0.1.0"
description = "Token-2022 transfer-tax launchpad whose tax funds Phoenix perp positions, with burn-to-redeem"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "terp"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "=1.0.2", features = ["init-if-needed"] }
anchor-spl = "=1.0.2"

[dev-dependencies]
proptest = "1"
sha2 = "0.10"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
